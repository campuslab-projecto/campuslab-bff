
server:
  port: 8080

spring:
  application:
    name: ms-campuslab-bff

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/902cf874-0ee4-4917-b9cb-6b55af9993be/v2.0

# ==========================================
# CONFIGURACION CAMPUSLAB
# ==========================================
campuslab:

  # Seguridad Microsoft Entra ID
  security:
    audience: 36ccc99d-6294-4333-a064-d62fa6237c7c

  # ==========================================
  # PRODUCTOR KAFKA DE DEMOSTRACION
  # ==========================================
  kafka:
    demo:
      enabled: ${CAMPUSLAB_KAFKA_DEMO_ENABLED:false}

# ==========================================
# MICROSERVICIOS
# ==========================================
services:

  bookings:
    url: ${BOOKINGS_SERVICE_URL:http://localhost:8081}

  rabbit-admin:
    url: ${RABBIT_ADMIN_SERVICE_URL:http://localhost:8082}

  audit:
    url: ${AUDIT_SERVICE_URL:http://localhost:8084}

  kafka-admin:
    url: ${KAFKA_ADMIN_SERVICE_URL:http://localhost:8086}

  report:
    url: ${REPORT_SERVICE_URL:http://localhost:8085}
